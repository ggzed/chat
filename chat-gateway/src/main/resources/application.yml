server:
  port: 8084
spring:
  application:
    name: chat-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
    gateway:
      server:
        webflux:
          routes:
            - id: spring-ai-route
              # 👇 lb 代表 LoadBalanced，后面是 Nacos 里的服务名
              uri: lb://chat-springai
              predicates:
                # 对外：POST /api/springai/chat/simple
                - Path=/api/springai/**
              filters:
                - RewritePath=/api/springai/(?<segment>.*), /api/$\{segment}

            - id: langchain4j-route
              uri: lb://chat-langchain4j
              predicates:
                # 对外：POST /api/langchain4j/chat/simple（与 springai 同路径、同入参、同出参）
                - Path=/api/langchain4j/**
              filters:
                - RewritePath=/api/langchain4j/(?<segment>.*), /api/$\{segment}