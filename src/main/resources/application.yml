spring:
  datasource:
    # 注意：file:./data/chat_session 表示在项目根目录生成 data/chat_session.mv.db 文件
    url: jdbc:h2:file:./data/chat_session;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  elasticsearch:
    uris: http://192.168.101.100:9200
    # 如果你有密码就加上 username / password
  ai:
    session:
      repository:
        jdbc:
          initialize-schema: always # 第一次启动时自动建表
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 500
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        enabled: false
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      elasticsearch:
        index-name: financial_rag # 手动建好的索引，默认名是 spring-ai-document-index
        dimensions: 1024
        initialize-schema: false # 咱们已经手动建好 Mapping 了，关掉自动初始化

    chat:
      client:
        enabled: false

server:
  port: 8080
logging:
  level:
    # 开启 Spring AI Client 的日志，用于查看请求和响应
    org.springframework.ai.chat.client.advisor: DEBUG
    # 如果你想看更底层的 HTTP 请求交互，可以加上这个（可选）
    org.springframework.ai.model: DEBUG
    # 打印底层发给 DeepSeek 的原始请求和响应
    org.springframework.web.reactive.function.client.ExchangeFunctions: DEBUG
    org.springframework.ai.chat.client: DEBUG
