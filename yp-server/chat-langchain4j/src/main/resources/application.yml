server:
  port: 8083
spring:
  application:
    # 👈 核心：这个名字必须和网关里 lb://chat-langchain4j 保持一致！
    name: chat-langchain4j
  # 👈 注册到 Nacos
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      temperature: 0.7
      log-requests: true
      log-responses: true